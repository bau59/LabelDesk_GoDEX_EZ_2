<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelDesk Editor</title>
<style>

:root {
 color-scheme:light;
 --bg:#f5f7fb; --panel:#ffffff; --surface:#f4f6fa;
 --line:#e2e7ef; --fg:#202c40; --muted:#6b788b;
 --accent:#345cd3; --accent-soft:#eaf0ff; --warning:#9a6416;
 font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
* {box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);user-select:none}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--fg);padding:8px 11px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:#f3f6fc;border-color:#cbd5e4}
button:active{background:#eaf0fa}
button:disabled{opacity:.43;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,textarea,select{background:#fff;color:var(--fg);border:1px solid #cfd8e6;border-radius:8px;padding:9px;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid #9ab9ff;outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:86px;user-select:text;white-space:pre-wrap;line-height:1.5}
input{user-select:text}
.layout{display:grid;grid-template-columns:178px minmax(270px,1fr) 246px;height:100%}
.panel{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.panelhead{height:52px;padding:17px 15px 12px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);letter-spacing:-.1px}
.smallmuted{font-size:11px;color:var(--muted);font-weight:400}
#layers{overflow:auto;flex:1;padding:10px}
.layer{width:100%;border:1px solid transparent;background:transparent;display:flex;gap:8px;align-items:center;text-align:left;padding:11px 10px;border-radius:10px;margin:3px 0;white-space:normal}
.layer:hover{background:var(--surface);border-color:var(--line)}
.layer.selected{background:var(--accent-soft);border-color:#c5d5ff}
.layer .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.layer.selected .label{color:#254ea8;font-weight:650}
.layer .glyph{color:var(--accent);font-size:12px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.layerbottom{border-top:1px solid var(--line);padding:11px;display:flex;gap:6px;justify-content:space-between}
.layerbottom button{flex:1;padding:8px 4px}
.work{min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:11px 13px;border-bottom:1px solid var(--line);background:#fff}
.tools button[data-add]{border-color:#cbd6e7;font-weight:550}
.tools .divider{width:1px;height:24px;background:var(--line);margin:0 5px}
.tools label{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}
.tools select{width:77px;padding:7px 5px}
#desk{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:center;padding:35px 25px 45px;background:radial-gradient(circle at 48% 35%,#fbfcff,#eff2f7 82%)}
#label{position:relative;flex-shrink:0;background:#fff;color:#000;border:1px solid #b6c1d1;box-shadow:0 18px 40px #23314623;overflow:visible}
#grid{position:absolute;inset:0;pointer-events:none;z-index:1}
.obj{position:absolute;z-index:2;cursor:move;overflow:visible;touch-action:none}
.obj .visual{width:100%;height:100%;overflow:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere}
.obj.sel{outline:2px solid var(--accent);outline-offset:0}
.resize-handle{position:absolute;width:12px;height:12px;border:2px solid #fff;background:var(--accent);border-radius:3px;z-index:5;touch-action:none;pointer-events:auto;box-shadow:0 0 0 1px #3257a7}
.resize-handle.nw{left:-6px;top:-6px;cursor:nwse-resize}
.resize-handle.ne{right:-6px;top:-6px;cursor:nesw-resize}
.resize-handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.resize-handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.obj:not(.sel){cursor:pointer}
.obj:not(.sel):hover{outline:2px dashed #8ca7ed;outline-offset:1px}
.obj.sel{cursor:move}
.printzone{position:absolute;top:0;bottom:0;z-index:4;pointer-events:none;border-left:2px dashed #8293a9;background:repeating-linear-gradient(135deg,#95a4b530 0px,#95a4b530 5px,#95a4b509 5px,#95a4b509 10px)}
.mediazone{position:absolute;z-index:4;pointer-events:none;border-left:2px dashed #dc6473;border-top:2px dashed #dc6473;background:repeating-linear-gradient(135deg,#e1667833 0px,#e1667833 5px,#e1667810 5px,#e1667810 10px)}

.obj.sel:hover{outline:2px solid #345cd3}
.obj:active{cursor:grabbing}
.layer{cursor:pointer}
#label{cursor:crosshair}
#desk{align-items:center}
.layer:focus-visible{outline:2px solid #64a2ff}
.obj .visual.text{line-height:1.04;color:#000;word-break:break-word}
.obj .visual.line{background:#000}
.obj .visual.rectangle{border:1.4px solid black}
.obj .visual.barcode{display:flex;align-items:flex-start;flex-direction:column;overflow:hidden}
.obj .visual.barcode svg{display:block;max-width:100%;flex:1;min-height:0}
.obj .visual.barcode .digits{width:100%;text-align:center;font-family:monospace;line-height:1}
.obj .visual.invalid{outline:2px dashed #d83f50}
#foot{min-height:38px;padding:11px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
#props{overflow-y:auto;padding:18px 15px;flex:1}
.prop{margin:0 0 16px;display:flex;flex-direction:column;gap:7px}
.prop>label{color:var(--muted);font-size:11px;font-weight:600}
.prop input,.prop select,.prop textarea{width:100%}
.prop-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dochead{padding:15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dochead label{color:var(--muted);font-size:11px;font-weight:600}
.dochead input{width:100%;font-weight:550}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:12px;line-height:1.6;padding:13px 7px}
strong{font-size:14px;display:block;margin-bottom:14px}
.text-align-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.text-align-controls button{font-size:19px;padding:7px;border-radius:8px}
.text-align-controls button.current{background:#eaf0ff;border-color:#7799eb;color:#2147ae;font-weight:bold}

.hint{margin-top:12px;color:var(--muted);line-height:1.55;font-size:12px}
.warn{color:var(--warning);font-size:11px;line-height:1.5;margin-top:7px}
.dividerline{border-top:1px solid var(--line);margin:16px 0}
.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg)}
.checkbox input{width:auto;accent-color:var(--accent)}

</style>
</head>
<body>
<div class="layout">
 <aside class="panel left">
   <div class="panelhead">Слои <span class="smallmuted" id="layerCount"></span></div>
   <div id="layers"></div>
   <div class="layerbottom">
     <button id="up" title="Поднять слой">↑</button>
     <button id="down" title="Опустить слой">↓</button>
     <button id="clone" title="Дублировать">Дубль</button>
     <button id="remove" title="Удалить">×</button>
   </div>
 </aside>
 <main class="work">
   <div class="tools">
     <button data-add="text">+ Текст</button>
     <button data-add="barcode">+ Штрихкод</button>
     <button data-add="line">+ Линия</button>
     <button data-add="rectangle">+ Рамка</button>
     <div class="divider"></div>
     <button id="undo" title="Отменить · ⌘Z">↶</button>
     <button id="redo" title="Повторить · ⌘⇧Z">↷</button>
     <label>Масштаб <select id="zoom"><option value="fit" selected>Вписать</option><option value="6">6×</option><option value="8">8×</option><option value="10">10×</option><option value="12">12×</option><option value="16">16×</option></select></label>
   </div>
   <div id="desk"><div id="label" aria-label="Макет этикетки"><div id="grid"></div></div></div>
   <div id="foot">Щёлкните по объекту или слою для выбора · перетащите для перемещения · тяните за угол для размера · двойной щелчок — текст · стрелки — точное движение</div>
 </main>
 <aside class="panel right">
   <div class="panelhead">Свойства слоя</div>
   <div class="dochead"><label for="docname">Название макета</label><input id="docname" type="text" autocomplete="off"></div>
   <div id="props"></div>
 </aside>
</div>
<script src="barcodes.js"></script>
<script>
(function(){
"use strict";
let doc=null, selected=null, zoom=8, zoomMode="fit", history=[], future=[], snap=true;
let printerMedia={widthMM:58,heightMM:38,gapMM:2};
const $=id=>document.getElementById(id);
const typeNames={text:"Текст",barcode:"Code 39",line:"Линия",rectangle:"Рамка"};
const patterns={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","A":"wnnnnwnnw","B":"nnwnnwnnw","C":"wnwnnwnnn","D":"nnnnwwnnw","E":"wnnnwwnnn","F":"nnwnwwnnn","G":"nnnnnwwnw","H":"wnnnnwwnn","I":"nnwnnwwnn","J":"nnnnwwwnn","K":"wnnnnnnww","L":"nnwnnnnww","M":"wnwnnnnwn","N":"nnnnwnnww","O":"wnnnwnnwn","P":"nnwnwnnwn","Q":"nnnnnnwww","R":"wnnnnnwwn","S":"nnwnnnwwn","T":"nnnnwnwwn","U":"wwnnnnnnw","V":"nwwnnnnnw","W":"wwwnnnnnn","X":"nwnnwnnnw","Y":"wwnnwnnnn","Z":"nwwnwnnnn","-":"nwnnnnwnw",".":"wwnnnnwnn"," ":"nwwnnnwnn","$":"nwnwnwnnn","/":"nwnwnnnwn","+":"nwnnnwnwn","%":"nnnwnwnwn","*":"nwnnwnwnn"};
const clone=o=>JSON.parse(JSON.stringify(o));
function uid(){return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){let r=Math.floor(Math.random()*16);return (c==="x"?r:(r&3|8)).toString(16)});}
function send(type,payload){
 const message=Object.assign({type:type},payload||{});
 if(window.parent!==window){
   window.parent.postMessage(Object.assign({source:"labeldesk-editor"},message),"*");
 }else if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.labelDesk){
   window.webkit.messageHandlers.labelDesk.postMessage(message);
 }
}
function commit(){if(!doc)return;send("document",{json:JSON.stringify(doc),selected:selected});}
function checkpoint(){if(!doc)return;history.push(clone(doc));if(history.length>80)history.shift();future=[];}
function restore(list,to){if(!list.length||!doc)return;to.push(clone(doc));doc=list.pop();selected=doc.elements.some(e=>e.id===selected)?selected:null;draw();commit();}
function selectedObj(){return doc&&doc.elements.find(e=>e.id===selected);}
function setSelected(id){if(!doc||!doc.elements.some(e=>e.id===id))return;selected=id;draw();}
function newElem(kind){
 if(!doc)return;
 const full=Math.min(55,doc.widthMM), last=doc.elements.reduce((n,e)=>Math.max(n,e.yMM+e.heightMM),0);
 const defaults={text:[0,3,full,7,"Текст"],barcode:[0,12,full,13,"1234567890"],
   line:[0,20,full,0.4,""],rectangle:[0,3,full,18,""]}[kind];
 const dims=defaults.slice();
 if(doc.elements.length && kind!=="rectangle"){
   dims[1]=Math.max(0,Math.min(doc.heightMM-dims[3],last+1));
 }
 let e={id:uid(),kind:kind,xMM:dims[0],yMM:dims[1],widthMM:dims[2],heightMM:dims[3],
   value:dims[4],fontSize:12,rotation:0,showsHumanReadable:true,isBold:false,
   isVariable:kind==="text",fieldName:"",barcodeType:"CODE128",renderMode:"auto",deviceFont:"A11"};
 e.widthMM=Math.max(1,Math.min(e.widthMM,doc.widthMM-e.xMM));
 e.yMM=Math.min(e.yMM,Math.max(0,doc.heightMM-e.heightMM));
 checkpoint();doc.elements.push(e);selected=e.id;draw();commit();
}
function moveLayer(delta){
 if(!doc)return;let index=doc.elements.findIndex(e=>e.id===selected);let dest=index+delta;
 if(index<0||dest<0||dest>=doc.elements.length)return;
 checkpoint();let item=doc.elements.splice(index,1)[0];doc.elements.splice(dest,0,item);draw();commit();
}
function remove(){if(!selected||!doc)return;checkpoint();doc.elements=doc.elements.filter(e=>e.id!==selected);selected=null;draw();commit();}
function duplicate(){const e=selectedObj();if(!e)return;checkpoint();let copy=clone(e);copy.id=uid();copy.xMM=Math.min(Math.max(0,doc.widthMM-copy.widthMM),copy.xMM+1);copy.yMM=Math.min(Math.max(0,doc.heightMM-copy.heightMM),copy.yMM+1);doc.elements.push(copy);selected=copy.id;draw();commit();}
function labelFor(e){const variable=(e.kind==="text"&&e.isVariable!==false)?" • перем.":"";return typeNames[e.kind]+variable+" · "+(e.value||"");}
function renderLayers(){
 const root=$("layers");root.replaceChildren();
 if(!doc||!doc.elements.length){let p=document.createElement("p");p.className="empty";p.textContent="Пока нет объектов. Добавьте текст или штрихкод.";root.appendChild(p);}
 else doc.elements.slice().reverse().forEach(function(e){
   const b=document.createElement("button");b.type="button";b.className="layer"+(selected===e.id?" selected":"");b.title="Выделить объект";
   const glyph=document.createElement("span");glyph.className="glyph";glyph.textContent={text:"T",barcode:"▥",line:"━",rectangle:"▢"}[e.kind];
   const name=document.createElement("span");name.className="label";name.textContent=labelFor(e);
   b.append(glyph,name);b.addEventListener("click",()=>setSelected(e.id));root.appendChild(b);
 });
 $("layerCount").textContent=doc?"("+doc.elements.length+")":"";
 const pos=doc?doc.elements.findIndex(e=>e.id===selected):-1;
 $("up").disabled=pos<0||pos===doc.elements.length-1;
 $("down").disabled=pos<=0;
 $("clone").disabled=pos<0;$("remove").disabled=pos<0;
}
function barcodeSVG(item,width,height){
 try{
  const result=window.EZ2Barcodes.layout(item.barcodeType||"CODE39",item.value,width*8);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+(width*8)+" 100");
  svg.setAttribute("preserveAspectRatio","none");
  for(let i=0;i<result.bits.length;i++){
    if(result.bits[i]!=="1")continue;
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",result.offset+i*result.moduleDots);
    rect.setAttribute("y",0);
    rect.setAttribute("width",result.moduleDots);
    rect.setAttribute("height",100);
    rect.setAttribute("fill","#000");
    svg.appendChild(rect);
  }
  svg.style.width="100%";
  svg.style.height=item.showsHumanReadable?"calc(100% - 15px)":"100%";
  return {svg,label:result.display};
 }catch(error){
  return {svg:null,label:"",error:error.message};
 }
}
function renderCanvas(){
 const el=$("label");el.querySelectorAll(".obj,.printzone,.mediazone").forEach(n=>n.remove());if(!doc)return;
 if(zoomMode==="fit"){
   const desk=$("desk");
   const usableWidth=Math.max(220,desk.clientWidth-100);
   const usableHeight=Math.max(160,desk.clientHeight-110);
   zoom=Math.max(4,Math.min(18,Math.floor(Math.min(
     usableWidth/Math.max(10,doc.widthMM),
     usableHeight/Math.max(10,doc.heightMM)
   ))));
 }
 let width=Math.max(10,Math.min(60,Number(doc.widthMM)||40)),height=Math.max(10,Math.min(100,Number(doc.heightMM)||30));
 el.style.width=(width*zoom)+"px";el.style.height=(height*zoom)+"px";
 $("grid").style.backgroundImage="linear-gradient(to right,#0000000d 1px,transparent 1px),linear-gradient(to bottom,#0000000d 1px,transparent 1px)";
 $("grid").style.backgroundSize=zoom+"px "+zoom+"px";
 doc.elements.forEach(function(e){
   let node=document.createElement("div");node.className="obj"+(selected===e.id?" sel":"");node.dataset.id=e.id;
   node.style.left=(e.xMM*zoom)+"px";node.style.top=(e.yMM*zoom)+"px";
   node.style.width=Math.max(3,e.widthMM*zoom)+"px";node.style.height=Math.max(3,e.heightMM*zoom)+"px";
   let visual=document.createElement("div");visual.className="visual "+e.kind;
   if(e.kind==="text"){
     visual.textContent=e.value||"";
     visual.style.fontSize=(e.fontSize*zoom/2.8346457)+"px";visual.style.fontWeight=e.isBold?"700":"400";
     visual.style.textAlign=e.textAlignment||"left";
     visual.style.transform="rotate("+(e.rotation||0)+"deg)";
   } else if(e.kind==="barcode"){
     const preview=barcodeSVG(e,e.widthMM,e.heightMM);
     if(preview.svg)visual.appendChild(preview.svg);
     else {visual.textContent=preview.error;visual.classList.add("invalid");}
     if(e.showsHumanReadable&&preview.svg){
       let digits=document.createElement("div");digits.className="digits";
       digits.textContent=preview.label;
       digits.style.fontSize=Math.max(9,zoom*1.65)+"px";
       visual.appendChild(digits);
     }
   }
   node.appendChild(visual);
   if(selected===e.id){
     for(const corner of ["nw","ne","sw","se"]){
       const handle=document.createElement("div");
       handle.className="resize-handle "+corner;
       handle.title="Изменить размер выбранного слоя";
       handle.addEventListener("pointerdown",ev=>startManipulation(ev,e.id,corner));
       node.appendChild(handle);
     }
   }
   node.title=selected===e.id?"Перетащите объект · углы изменяют размер":"Щёлкните или перетащите для выбора слоя";
   node.addEventListener("click",ev=>{ev.stopPropagation();});
   node.addEventListener("dblclick",ev=>{
     ev.stopPropagation();
     if(selected!==e.id)return;
     const field=$("field-value");
     if(field){field.focus();field.select();}
   });
   node.addEventListener("pointerdown",ev=>startManipulation(ev,e.id,"move"));
   el.appendChild(node);
 });
 // Neutral marking for the independently verified ESC G55 raster limit.
 // It is NOT the edge of the physical label and not the incompatibility marker.
 if(width>55){
   const limited=document.createElement("div");limited.className="printzone";
   limited.style.left=(55*zoom)+"px";
   limited.style.width=((width-55)*zoom)+"px";
   limited.title="Предел растровой печати ESC G55 — 55 мм; это не граница рулона";
   el.appendChild(limited);
 }
 // Red hatching follows the ACTUAL roll dimensions configured in Settings.
 if(width>printerMedia.widthMM){
   const beyond=document.createElement("div");beyond.className="mediazone";
   beyond.style.left=(printerMedia.widthMM*zoom)+"px";
   beyond.style.width=((width-printerMedia.widthMM)*zoom)+"px";
   beyond.style.top="0";beyond.style.bottom="0";
   beyond.title="Шаблон шире рулона, указанного в настройках";
   el.appendChild(beyond);
 }
 if(height>printerMedia.heightMM){
   const beyond=document.createElement("div");beyond.className="mediazone";
   beyond.style.left="0";beyond.style.right="0";
   beyond.style.top=(printerMedia.heightMM*zoom)+"px";
   beyond.style.height=((height-printerMedia.heightMM)*zoom)+"px";
   beyond.title="Шаблон выше рулона, указанного в настройках";
   el.appendChild(beyond);
 }
}
// Geometry is kept pure so native CI can test corner resizing without a WebView.
function transformRect(original,dx,dy,mode,docWidth,docHeight,step,minimum){
 const round=n=>Math.round(n/step)*step;
 const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
 if(mode==="move"){
   return {
     xMM:clamp(round(original.xMM+dx),0,Math.max(0,docWidth-original.widthMM)),
     yMM:clamp(round(original.yMM+dy),0,Math.max(0,docHeight-original.heightMM)),
     widthMM:original.widthMM,
     heightMM:original.heightMM
   };
 }
 let left=original.xMM,top=original.yMM;
 let right=original.xMM+original.widthMM,bottom=original.yMM+original.heightMM;
 if(mode.includes("w"))left=clamp(round(original.xMM+dx),0,right-minimum);
 if(mode.includes("e"))right=clamp(round(original.xMM+original.widthMM+dx),left+minimum,docWidth);
 if(mode.includes("n"))top=clamp(round(original.yMM+dy),0,bottom-minimum);
 if(mode.includes("s"))bottom=clamp(round(original.yMM+original.heightMM+dy),top+minimum,docHeight);
 return {xMM:left,yMM:top,widthMM:Math.max(minimum,right-left),heightMM:Math.max(minimum,bottom-top)};
}

function startManipulation(ev,id,mode){
 // A canvas click is an explicit selection, not an automatic layer guess.
 if(ev.button!==0||!doc)return;
 const item=doc.elements.find(x=>x.id===id);if(!item)return;
 ev.preventDefault();ev.stopPropagation();
 if(selected!==id){
   selected=id;
   renderLayers();renderProps();renderCanvas();
 }
 const original=clone(item),sx=ev.clientX,sy=ev.clientY,step=snap?1:0.125;
 const minimum=item.kind==="line"?0.125:1;
 checkpoint();
 function move(event){
   const active=doc.elements.find(x=>x.id===selected);if(!active||active.id!==id)return;
   const dims=transformRect(original,(event.clientX-sx)/zoom,(event.clientY-sy)/zoom,
                            mode,doc.widthMM,doc.heightMM,step,minimum);
   Object.assign(active,dims);
   renderCanvas();
 }
 function finish(){
   window.removeEventListener("pointermove",move);
   window.removeEventListener("pointerup",finish);
   window.removeEventListener("pointercancel",finish);
   window.removeEventListener("blur",finish);
   renderCanvas();renderProps();renderLayers();commit();
 }
 window.addEventListener("pointermove",move);
 window.addEventListener("pointerup",finish);
 window.addEventListener("pointercancel",finish);
 window.addEventListener("blur",finish);
}
function prop(title,control){
 let div=document.createElement("div");div.className="prop";
 let lbl=document.createElement("label");lbl.textContent=title;
 div.append(lbl,control);return div;
}
function textInput(value,onChange,multiline,id){
 let el=document.createElement(multiline?"textarea":"input");if(!multiline)el.type="text";if(id)el.id=id;el.value=value??"";
 el.addEventListener("focus",()=>checkpoint());
 el.addEventListener("input",()=>{onChange(el.value);renderCanvas();renderLayers();commit();});
 return el;
}
function numInput(value,onChange,min,max,step){
 let el=document.createElement("input");el.type="number";el.step=String(step??0.1);if(min!==undefined)el.min=String(min);if(max!==undefined)el.max=String(max);
 el.value=String(value);el.addEventListener("change",()=>{const n=Number(el.value);if(!Number.isFinite(n))return;checkpoint();onChange(Math.max(min??-1e6,Math.min(max??1e6,n)));renderCanvas();renderLayers();commit();});
 return el;
}
function checkbox(label,value,onChange){
 let row=document.createElement("label");row.className="checkbox";
 let input=document.createElement("input");input.type="checkbox";input.checked=Boolean(value);input.addEventListener("change",()=>{checkpoint();onChange(input.checked);renderCanvas();commit();});
 let txt=document.createElement("span");txt.textContent=label;row.append(input,txt);return row;
}
function pair(left,right){let p=document.createElement("div");p.className="prop-row";p.append(left,right);return p;}
function renderProps(){
 const root=$("props");root.replaceChildren();if(!doc)return;
 const e=selectedObj();
 if(!e){
   const h=document.createElement("strong");h.textContent="Размер этикетки";root.appendChild(h);
   root.appendChild(pair(prop("Ширина ленты, мм",numInput(doc.widthMM,n=>{doc.widthMM=n;},10,60,0.5)),
                        prop("Высота, мм",numInput(doc.heightMM,n=>{doc.heightMM=Math.round(n);},10,100,1))));
   root.appendChild(prop("Зазор, мм",numInput(doc.gapMM,n=>{doc.gapMM=Math.round(n);},0,10,1)));
   let note=document.createElement("p");note.className="hint";note.textContent=doc.widthMM>55?"Ширина ленты — "+doc.widthMM+" мм. Заштрихованные справа "+(doc.widthMM-55).toFixed(1)+" мм НЕ печатаются ESC G. Печатная графика — 0…55 мм.":"Материал — до 60 мм, графика ESC G — до 55 мм. Выберите слой для редактирования.";;root.appendChild(note);
   root.appendChild(checkbox("Привязка к сетке 1 мм",snap,n=>{snap=n;}));
   return;
 }
 let h=document.createElement("strong");h.textContent=typeNames[e.kind];root.appendChild(h);
 if(e.kind==="text"||e.kind==="barcode")root.appendChild(prop(e.kind==="text"?"Текст":"Данные штрихкода",textInput(e.value,v=>{e.value=v;},e.kind==="text","field-value")));
 root.appendChild(pair(prop("X, мм",numInput(e.xMM,n=>{e.xMM=Math.min(n,Math.max(0,doc.widthMM-e.widthMM));},0,60,0.125)),
                       prop("Y, мм",numInput(e.yMM,n=>{e.yMM=Math.min(n,Math.max(0,doc.heightMM-e.heightMM));},0,100,0.125))));
 root.appendChild(pair(prop("Ширина, мм",numInput(e.widthMM,n=>{e.widthMM=Math.min(n,doc.widthMM-e.xMM);},0.125,60,0.125)),
                       prop("Высота, мм",numInput(e.heightMM,n=>{e.heightMM=Math.min(n,doc.heightMM-e.yMM);},0.125,100,0.125))));
 if(e.kind==="text"){
   root.appendChild(prop("Кегль, pt (для растра)",numInput(e.fontSize,n=>{e.fontSize=n;},5,52,1)));
   const modes=document.createElement("select");
   for(const [id,label] of [["auto","Авто — растр, пока встроенные команды не проверены"],
      ["device","Встроенный ASCII — тестовый режим"]]){
     let opt=document.createElement("option");opt.value=id;opt.textContent=label;modes.appendChild(opt);
   }
   modes.value=e.renderMode||"auto";
   modes.addEventListener("change",()=>{checkpoint();e.renderMode=modes.value;renderProps();commit();});
   root.appendChild(prop("Способ вывода",modes));
   if(e.renderMode==="device"){
     const fonts=document.createElement("select");
     for(const preset of ["A11","A12","A13","A14","A21","A22","A31","A41","A00","A01","A02","A03","A04"]){
       const opt=document.createElement("option");opt.value=preset;opt.textContent=preset;fonts.appendChild(opt);
     }
     fonts.value=e.deviceFont||"A11";
     fonts.addEventListener("change",()=>{checkpoint();e.deviceFont=fonts.value;commit();});
     root.appendChild(prop("Встроенный размер EZ-2 (ESC)",fonts));
     const warn=document.createElement("p");warn.className="warn";
     warn.textContent="Встроенный шрифт поддерживает ASCII. Кириллица останется в растровой печати. Реальная печать этим режимом будет включена после теста протокола.";
     root.appendChild(warn);
   }
   root.appendChild(checkbox("Жирный",e.isBold,n=>{e.isBold=n;}));
   const alignControls=document.createElement("div");alignControls.className="text-align-controls";
   for(const [mode,title] of [["left","По левому краю"],["center","По центру"],["right","По правому краю"]]){
     const button=document.createElement("button");button.type="button";
     button.textContent={left:"⫷",center:"≡",right:"⫸"}[mode];
     button.title=title;
     button.className=(e.textAlignment||"left")===mode?"current":"";
     button.onclick=()=>{
       checkpoint();e.textAlignment=mode;renderCanvas();renderProps();commit();
     };
     alignControls.appendChild(button);
   }
   root.appendChild(prop("Выравнивание текста",alignControls));
   root.appendChild(checkbox("Менять при печати",e.isVariable!==false,n=>{e.isVariable=n;renderLayers();}));
   if(e.isVariable!==false){
     root.appendChild(prop("Название поля в режиме заполнения",
       textInput(e.fieldName||"",v=>{e.fieldName=v;},false,"field-name")));
   }
   let rotation=document.createElement("select");
   for(let angle of [0,90,180,270]){let opt=document.createElement("option");opt.value=angle;opt.textContent=angle+"°";rotation.append(opt);}rotation.value=e.rotation;
   rotation.addEventListener("change",()=>{checkpoint();e.rotation=Number(rotation.value);renderCanvas();commit();});
   root.appendChild(prop("Поворот",rotation));
 } else if(e.kind==="barcode"){
   const kind=document.createElement("select");
   for(const [id,label] of [["CODE128","Code 128 (автоматически B/C)"],["CODE39","Code 39"],
      ["EAN13","EAN-13 (с контрольной цифрой)"],["EAN8","EAN-8 (с контрольной цифрой)"]]){
     const opt=document.createElement("option");opt.value=id;opt.textContent=label;kind.appendChild(opt);
   }
   kind.value=e.barcodeType||"CODE39";
   kind.addEventListener("change",()=>{checkpoint();e.barcodeType=kind.value;draw();commit();});
   root.appendChild(prop("Формат штрихкода",kind));
   root.appendChild(checkbox("Печатать цифры под штрихкодом",e.showsHumanReadable,n=>{e.showsHumanReadable=n;}));
   const status=document.createElement("p");status.className="hint";
   try{
     const coded=window.EZ2Barcodes.layout(e.barcodeType||"CODE39",e.value,e.widthMM*8);
     status.textContent="Код: "+coded.display+" · "+coded.moduleDots+" точек/модуль"+
       (coded.checksum!==undefined?" · проверка: "+coded.checksum:"");
   }catch(error){status.className="warn";status.textContent=error.message;}
   root.appendChild(status);
   const info=document.createElement("p");info.className="hint";
   info.textContent="Штрихкод генерируется как сканируемые модули, не шрифт. В редакторе и в печати используется один кодировщик. EAN: контрольная цифра рассчитывается или проверяется.";
   root.appendChild(info);
 }
 let positionActions=document.createElement("div");positionActions.className="actions";
 for(const [axis,title] of [["x","Блок по центру X"],["y","Блок по центру Y"]]){
   const button=document.createElement("button");button.type="button";button.textContent=title;
   button.onclick=()=>{
     checkpoint();
     if(axis==="x")e.xMM=Math.max(0,(doc.widthMM-e.widthMM)/2);
     else e.yMM=Math.max(0,(doc.heightMM-e.heightMM)/2);
     renderCanvas();renderProps();commit();
   };
   positionActions.appendChild(button);
 }
 root.appendChild(prop("Расположение блока",positionActions));
 if(e.kind==="text"||e.kind==="barcode"||e.kind==="line"){
   const full=document.createElement("button");full.type="button";
   full.textContent="На всю ширину печати";
   full.onclick=()=>{
     checkpoint();e.xMM=0;e.widthMM=Math.min(55,doc.widthMM);
     renderCanvas();renderProps();commit();
   };
   root.appendChild(prop("Ширина блока",full));
 }
 let sep=document.createElement("div");sep.className="dividerline";root.appendChild(sep);
 let actions=document.createElement("div");actions.className="actions";
 let c=document.createElement("button");c.textContent="Дублировать";c.onclick=duplicate;
 let d=document.createElement("button");d.textContent="Удалить";d.onclick=remove;
 actions.append(c,d);root.appendChild(actions);
}
function draw(){
 if(!doc)return;
 $("docname").value=doc.name;
 renderLayers();renderCanvas();renderProps();
 $("undo").disabled=!history.length;$("redo").disabled=!future.length;
}
window.labelDeskSetMedia=function(media){
 if(!media)return;
 const w=Number(media.widthMM),h=Number(media.heightMM),g=Number(media.gapMM);
 if(!Number.isFinite(w)||!Number.isFinite(h)||!Number.isFinite(g))return;
 printerMedia={widthMM:w,heightMM:h,gapMM:g};
 if(doc)renderCanvas();
};
window.labelDeskLoad=function(next){
 if(!next||!Array.isArray(next.elements))return;
 const previousSelected=selected?.toLowerCase();
 doc=clone(next);const same=doc.elements.find(e=>e.id.toLowerCase()===previousSelected);
 selected=same?same.id:(doc.elements.length?doc.elements[doc.elements.length-1].id:null);history=[];future=[];draw();
};
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>newElem(b.dataset.add)));
$("docname").addEventListener("focus",()=>{if(doc)checkpoint();});
$("docname").addEventListener("input",function(){if(!doc)return;doc.name=this.value;commit();});
$("label").addEventListener("click",ev=>{ev.stopPropagation();});
$("zoom").addEventListener("change",function(){zoomMode=this.value;if(zoomMode!=="fit")zoom=Number(this.value);renderCanvas();});
window.addEventListener("resize",()=>{if(zoomMode==="fit")renderCanvas();});
$("up").onclick=()=>moveLayer(1);$("down").onclick=()=>moveLayer(-1);
$("clone").onclick=duplicate;$("remove").onclick=remove;
$("undo").onclick=()=>{restore(history,future);$("undo").disabled=!history.length;$("redo").disabled=!future.length;};
$("redo").onclick=()=>{restore(future,history);$("undo").disabled=!history.length;$("redo").disabled=!future.length;};
document.addEventListener("keydown",function(ev){
 const editable=["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName);
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();send("save");return;}
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();if(ev.shiftKey)$("redo").click();else $("undo").click();return;}
 if(!editable&&selected&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(ev.key)){
   ev.preventDefault();
   const e=selectedObj();if(!e)return;
   const step=ev.shiftKey?1:(snap?1:0.125);
   const dx=ev.key==="ArrowLeft"?-step:ev.key==="ArrowRight"?step:0;
   const dy=ev.key==="ArrowUp"?-step:ev.key==="ArrowDown"?step:0;
   checkpoint();
   Object.assign(e,transformRect(clone(e),dx,dy,"move",doc.widthMM,doc.heightMM,snap?1:0.125,1));
   renderCanvas();renderProps();commit();
   return;
 }
 if(!editable&&(ev.key==="Delete"||ev.key==="Backspace")){ev.preventDefault();remove();}
});
// Embedded editor receives JSON from the outer HTML application.
window.addEventListener("message",function(event){
 if(event.source!==window.parent || event.data?.source!=="labeldesk-app")return;
 if(event.data.type==="load" && event.data.document){
   if(event.data.media)window.labelDeskSetMedia(event.data.media);
   window.labelDeskLoad(event.data.document);
 }
});
send("ready");
})();
</script>
</body>
</html>
