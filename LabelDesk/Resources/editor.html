<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabelDesk Editor</title>
<style>

:root {
 color-scheme:light;
 --bg:#f5f7fb; --panel:#ffffff; --surface:#f4f6fa;
 --line:#e2e7ef; --fg:#202c40; --muted:#6b788b;
 --accent:#345cd3; --accent-soft:#eaf0ff; --warning:#9a6416;
 font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
* {box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);user-select:none}
button,input,textarea,select{font:inherit}
button{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--fg);padding:8px 11px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:#f3f6fc;border-color:#cbd5e4}
button:active{background:#eaf0fa}
button:disabled{opacity:.43;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input,textarea,select{background:#fff;color:var(--fg);border:1px solid #cfd8e6;border-radius:8px;padding:9px;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid #9ab9ff;outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:86px;user-select:text;white-space:pre-wrap;line-height:1.5}
input{user-select:text}
.layout{display:grid;grid-template-columns:var(--layer-width,210px) minmax(250px,1fr) minmax(225px,270px);height:100%}
.layout.layers-hidden{grid-template-columns:0 minmax(250px,1fr) minmax(225px,270px)}
.layout.layers-hidden .panel.left{overflow:hidden;border:0}
.layer-picker{max-width:200px;min-width:95px;flex:1}
.layer-width-control{width:80px;accent-color:var(--accent)}
#toggleLayers.active{background:var(--accent-soft);color:var(--accent);border-color:#a8bef1}
.panel{background:var(--panel);min-height:0;display:flex;flex-direction:column}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.panelhead{height:52px;padding:17px 15px 12px;font-size:13px;font-weight:700;border-bottom:1px solid var(--line);letter-spacing:-.1px}
.smallmuted{font-size:11px;color:var(--muted);font-weight:400}
#layers{overflow:auto;flex:1;padding:10px}
.layer{width:100%;border:1px solid transparent;background:transparent;display:flex;gap:8px;align-items:center;text-align:left;padding:11px 10px;border-radius:10px;margin:3px 0;white-space:normal}
.layer:hover{background:var(--surface);border-color:var(--line)}
.layer.selected{background:var(--accent-soft);border-color:#c5d5ff}
.layer .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.layer.selected .label{color:#254ea8;font-weight:650}
.layer .glyph{color:var(--accent);font-size:12px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.layerbottom{border-top:1px solid var(--line);padding:11px;display:flex;gap:6px;justify-content:space-between}
.layerbottom button{flex:1;padding:8px 4px}
.work{min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:11px 13px;border-bottom:1px solid var(--line);background:#fff}
.tools button[data-add]{border-color:#cbd6e7;font-weight:550}
.tools .divider{width:1px;height:24px;background:var(--line);margin:0 5px}
.tools label{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:500}
.tools select{width:77px;padding:7px 5px}
#desk{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:center;padding:35px 25px 45px;background:radial-gradient(circle at 48% 35%,#fbfcff,#eff2f7 82%)}
#label{position:relative;flex-shrink:0;background:#fff;color:#000;border:1px solid #b6c1d1;box-shadow:0 18px 40px #23314623;overflow:visible}
#grid{position:absolute;inset:0;pointer-events:none;z-index:1}
.obj{position:absolute;z-index:2;cursor:move;overflow:visible;touch-action:none}
.obj .visual{width:100%;height:100%;overflow:hidden;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere}
.obj.sel{outline:2px solid var(--accent);outline-offset:0}
.resize-handle{position:absolute;width:12px;height:12px;border:2px solid #fff;background:var(--accent);border-radius:3px;z-index:5;touch-action:none;pointer-events:auto;box-shadow:0 0 0 1px #3257a7}
.resize-handle.nw{left:-6px;top:-6px;cursor:nwse-resize}
.resize-handle.ne{right:-6px;top:-6px;cursor:nesw-resize}
.resize-handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.resize-handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.obj:not(.sel){cursor:pointer}
.obj:not(.sel):hover{outline:2px dashed #8ca7ed;outline-offset:1px}
.obj.sel{cursor:move}
.marginguide{position:absolute;top:0;bottom:0;z-index:4;pointer-events:none;
 background:repeating-linear-gradient(135deg,#a7b2c02b 0px,#a7b2c02b 5px,#a7b2c009 5px,#a7b2c009 10px);
 border-right:1px dashed #9aa7b8}
.printzone{position:absolute;top:0;bottom:0;z-index:4;pointer-events:none;border-left:2px dashed #8293a9;background:repeating-linear-gradient(135deg,#95a4b530 0px,#95a4b530 5px,#95a4b509 5px,#95a4b509 10px)}
.mediazone{position:absolute;z-index:4;pointer-events:none;border-left:2px dashed #dc6473;border-top:2px dashed #dc6473;background:repeating-linear-gradient(135deg,#e1667833 0px,#e1667833 5px,#e1667810 5px,#e1667810 10px)}

.obj.sel:hover{outline:2px solid #345cd3}
.obj:active{cursor:grabbing}
.layer{cursor:pointer}
#label{cursor:crosshair}
#desk{align-items:center}
.layer:focus-visible{outline:2px solid #64a2ff}
.obj .visual.text{line-height:1.04;color:#000;word-break:break-word}
.obj .visual.line{background:#000}
.obj .visual.rectangle{border:1.4px solid black}
.obj .visual.barcode{display:flex;align-items:flex-start;flex-direction:column;overflow:hidden}
.obj .visual.barcode svg{display:block;max-width:100%;flex:1;min-height:0}
.obj .visual.barcode .digits{width:100%;text-align:center;font-family:monospace;line-height:1}
.obj .visual.invalid{outline:2px dashed #d83f50}
#foot{min-height:38px;padding:11px 15px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
#props{overflow-y:auto;padding:18px 15px;flex:1}
.prop{margin:0 0 16px;display:flex;flex-direction:column;gap:7px}
.prop>label{color:var(--muted);font-size:11px;font-weight:600}
.prop input,.prop select,.prop textarea{width:100%}
.prop-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dochead{padding:15px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.dochead label{color:var(--muted);font-size:11px;font-weight:600}
.dochead input{width:100%;font-weight:550}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:12px;line-height:1.6;padding:13px 7px}
strong{font-size:14px;display:block;margin-bottom:14px}
.symbol-palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.symbol-palette button{font-size:17px;padding:6px 0;font-family:Menlo,monospace}
.text-align-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.text-align-controls button{font-size:19px;padding:7px;border-radius:8px}
.text-align-controls button.current{background:#eaf0ff;border-color:#7799eb;color:#2147ae;font-weight:bold}

.hint{margin-top:12px;color:var(--muted);line-height:1.55;font-size:12px}
.warn{color:var(--warning);font-size:11px;line-height:1.5;margin-top:7px}
.dividerline{border-top:1px solid var(--line);margin:16px 0}
.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--fg)}
.checkbox input{width:auto;accent-color:var(--accent)}


/* Editorial editor panels aligned with the catalog. Does not alter geometry. */
:root{--bg:#f8f9fb;--panel:#fff;--surface:#f5f6f8;--line:#e3e7ee;
  --fg:#19212b;--muted:#7c8795;--accent:#111827;--accent-soft:#f0f2f6;
  font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
button{border-color:#dce2ea;color:#263240;border-radius:8px;font-weight:560}
button:hover{background:#f5f7f9;border-color:#cbd4df}
input,textarea,select{border-color:#d8dfe8;border-radius:8px;padding:10px}
input:focus,textarea:focus,select:focus{outline-color:#8793a6;border-color:#111827}
.panelhead{font-size:13px;font-weight:720;height:54px;padding:18px;
  letter-spacing:-.2px;color:#172231}
.layer{font-size:12px;border-radius:8px;padding:11px 10px;margin:2px 0}
.layer .label{font-weight:540;color:#667386}
.layer.selected{border-color:#dce1e8;background:#f0f2f6}
.layer.selected .label{color:#121a26}
.layer .glyph{color:#344254;background:#f0f2f6;border-radius:7px}
.layerbottom{padding:12px;border-color:#e9edf2}
.tools{padding:12px 15px;border-color:#e7ebef;background:#fff;gap:8px}
.tools button[data-add]{border-color:#dce3eb;background:#fff;font-size:12px}
.tools label{font-size:11px;color:#718092}
.tools select{font-size:11px}
#desk{background:radial-gradient(circle at 50% 35%,#ffffff,#f1f3f6 75%)}
#label{border:1px solid #b4bfcd;box-shadow:0 16px 34px #11182716}
.obj.sel{outline-color:#111827}
.obj.sel:hover{outline-color:#111827}
.obj:not(.sel):hover{outline-color:#64748b}
.resize-handle{background:#111827;box-shadow:0 0 0 1px #111827}
#props{padding:20px 18px}
#props>strong{font-size:15px;color:#1c2530}
.prop{gap:7px;margin-bottom:15px}
.prop>label{color:#687587;font-size:11px}
.dochead{padding:19px 17px}
.dochead label{font-size:11px}
.dochead input{font-weight:620}
.hint{font-size:11px;color:#8190a0}
.warn{font-size:11px}
.text-align-controls button.current{color:#111827;border-color:#bfc7d2;background:#eceff4}
#foot{font-size:11px;color:#808c9b}
#toggleLayers.active{background:#edf0f4;color:#111827;border-color:#cbd4df}


/* Two task-specific workspaces, no mixing free XY and line mode controls. */
.mode-toolset{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.mode-toolset[data-mode-tools]{display:none}
body[data-editor-mode="text"] .mode-toolset[data-mode-tools="text"],
body[data-editor-mode="raster"] .mode-toolset[data-mode-tools="raster"]{display:flex}
.editor-mode-indicator{white-space:nowrap;border:1px solid #dae2eb;background:#f5f7fa;
 border-radius:7px;padding:8px 10px;color:#4d5e72;font-size:11px;font-weight:650}
body[data-editor-mode="text"] #desk{background:#edf0f4}
body[data-editor-mode="text"] #layerPicker,
body[data-editor-mode="text"] #layersWidth{display:none}
.layout{grid-template-columns:var(--layer-width,225px) minmax(265px,1fr) minmax(285px,320px)}
.layout.layers-hidden{grid-template-columns:0 minmax(265px,1fr) minmax(285px,320px)}
.font-cards+details{margin-top:12px}
#props details summary{font-size:12px;color:#596b80;font-weight:650;cursor:pointer;margin:11px 0}

body[data-editor-mode="text"] #grid{opacity:.2}
body[data-editor-mode="text"] #label{border-color:#c0c8d2}
.text-preview-row{position:absolute;z-index:2;overflow:visible;cursor:pointer}
.text-preview-row svg{display:block;width:100%;height:100%;overflow:visible}
.text-preview-row.is-reverse{background:#111}
.text-preview-row:hover{outline:1px dashed #8194aa}
.text-preview-row.sel{outline:2px solid #233149;background:#e7eef758}
.text-preview-error{position:absolute;z-index:7;left:6px;right:6px;bottom:6px;
 background:#fff4e6;border:1px solid #e7be85;color:#845515;border-radius:6px;
 font-size:12px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.text-mode-help{margin-top:8px;padding:12px 13px;border:1px solid #e3e8ef;
 background:#f8fafc;border-radius:8px;color:#536277;font-size:11px;line-height:1.5}
.mode-choices{display:grid;gap:9px;margin:11px 0 20px}
.mode-choice{display:flex;text-align:left;white-space:normal;align-items:flex-start;gap:12px;
 width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:14px;background:#fff}
.mode-choice:hover{background:#f8fafc}
.mode-choice.selected{border-color:#475569;background:#f1f4f8;box-shadow:inset 3px 0 #111827}
.mode-choice .mode-mark{width:34px;height:34px;display:grid;place-items:center;
 background:#e6eaf0;color:#27374d;font-size:19px;border-radius:8px;flex:none}
.mode-choice strong{margin:0;font-size:13px;font-weight:750}
.mode-choice small{display:block;color:#677789;font-weight:450;margin-top:4px;line-height:1.45;font-size:11px}
.font-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.font-card{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;
 overflow:hidden;white-space:normal;background:#fff;border:1px solid #e0e5ec;
 padding:12px 10px;text-align:left;border-radius:9px}
.font-card.selected{background:#edf1f6;border-color:#8e9daf;box-shadow:inset 0 2px #273345}
.font-card strong{margin:0;font-size:12px}
.font-card small{font-size:10px;color:#8a97a6}
.font-swatch{width:100%;height:49px;display:flex;align-items:center;justify-content:center;
 overflow:hidden;background:#f7f8fa;border-radius:5px}
.font-swatch svg{max-width:100%;max-height:42px;display:block}
.font-summary{color:#55677d;font-size:12px;background:#f5f7fa;border-radius:8px;
 padding:10px;margin:12px 0}
.frame-help{background:#f6f8fa;padding:12px;border-radius:9px;color:#546174;font-size:11px}


.zoom-controls{display:flex;gap:4px;align-items:center;white-space:nowrap}
.zoom-controls button{font-size:11px;padding:6px 9px}
.zoom-controls span{min-width:38px;text-align:center;font-size:11px;color:#677589}
.layer-picker,.layer-width-control{display:none!important}

.choice-buttons{display:flex;flex-wrap:wrap;gap:6px}
.choice-buttons button{font-size:11px;padding:7px 11px}
.choice-buttons button.current{background:#e9edf2;border-color:#9eaaba;font-weight:700;color:#172132}

/* Same input density and +/- controls as the outer application. */
#props input:not([type="checkbox"]),#props textarea,.dochead input{
 min-height:38px;border:1px solid #d3dce8;border-radius:9px;background:#fff;padding:8px 11px;
 font:inherit;color:#172132;max-width:100%;min-width:0
}
.editor-stepper{display:flex;align-items:stretch;min-width:0;max-width:260px;
 border:1px solid #d3dce8;border-radius:9px;background:#fff;overflow:hidden}
.editor-stepper input{min-width:30px;width:60px;max-width:100%;flex:1;text-align:center;
 border:0!important;border-radius:0!important;padding:5px!important;outline:0!important}
.editor-stepper input::-webkit-inner-spin-button,.editor-stepper input::-webkit-outer-spin-button{
 -webkit-appearance:none;margin:0
}
.editor-stepper button{width:34px;min-width:34px;padding:0;background:#f1f4f8;
 border:0;border-radius:0;font-size:17px;color:#253448}
.editor-stepper button:first-child{border-right:1px solid #d3dce8}
.editor-stepper button:last-child{border-left:1px solid #d3dce8}
.editor-stepper:focus-within{outline:2px solid #91a5c4}
#editorValidation{font-size:11px;color:#718093;margin-left:10px;max-width:38ch}
#editorValidation.error{color:#ac3848;font-weight:650}


.variable-buttons{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto}
.variable-buttons button{font-size:10px;padding:5px 8px}
.variable-buttons button.current{background:#203047;color:#fff}
.sample-panel{margin:14px 11px;border-top:1px solid #e4e9ef;padding:12px 4px}
.sample-panel summary{cursor:pointer;font-weight:700;font-size:12px}
#sampleSearch{width:100%;margin-top:11px}
.sample-options{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sample-options button{padding:5px 8px;font-size:10px}
.sample-options button.current{background:#1d2b42;color:#fff}
#samplePreview{max-width:100%;margin:10px 0;border:1px solid #d6dde8;background:#fff}

</style>
</head>
<body>
<div class="layout">
 <aside class="panel left">
   <div class="panelhead"><span id="leftPanelTitle">Строки</span> <span class="smallmuted" id="layerCount"></span></div>
   <div id="layers"></div>
   <div class="layerbottom">
     <button id="up" title="Поднять слой">↑</button>
     <button id="down" title="Опустить слой">↓</button>
     <button id="clone" title="Дублировать">Дубль</button>
     <button id="remove" title="Удалить">×</button>
   </div>
 </aside>
 <main class="work">
   <div class="tools">
     <button id="docSettings" title="Настройки размеров макета">⚙ Макет</button>
     <button id="toggleLayers" title="Показать или скрыть список слоёв">☷ Слои</button>
      <select id="layerPicker" class="layer-picker" aria-label="Выбрать слой" title="Быстрый выбор слоя"></select>
      <input id="layersWidth" class="layer-width-control" type="range" min="165" max="320" step="5" value="210" title="Ширина панели слоёв" aria-label="Ширина панели слоёв">
      <div class="divider"></div>
      <div class="mode-toolset" data-mode-tools="text">
        <button data-add="text">＋ Строка</button>
        <button data-add="line">＋ Линия CP866</button>
        <button data-add="inverseText">▰ Чёрная плашка</button>
        <button data-add="textTable">☷ Таблица</button>
        <button data-add="textFrame">▢ Рамка с текстом</button>
        <button data-add="barcode">＋ Штрихкод</button>
      </div>
      <div class="mode-toolset" data-mode-tools="raster">
        <button data-add="text">＋ Текст</button>
        <button data-add="line">＋ Линия</button>
        <button data-add="rectangle">＋ Рамка</button>
        <button data-add="framedText">▣ Рамка с текстом</button>
        <button data-add="barcode">＋ Штрихкод</button>
      </div>
      <span class="editor-mode-indicator" id="editorModeIndicator" title="Режим задаётся в настройках макета">Текст CP866</span>
      <div class="divider"></div>
     <button id="undo" title="Отменить · ⌘Z">↶</button>
     <button id="redo" title="Повторить · ⌘⇧Z">↷</button>
     <div class="zoom-controls"><button id="zoomFit" type="button" title="Вписать всю этикетку">Вписать</button><button id="zoomMinus" type="button" title="Уменьшить">−</button><span id="zoomIndicator" aria-live="polite">Авто</span><button id="zoomPlus" type="button" title="Увеличить">+</button></div>
   </div>
   <div id="desk"><div id="label" aria-label="Макет этикетки"><div id="grid"></div></div></div>
   <div id="foot">Щёлкните по объекту или слою для выбора · перетащите для перемещения · тяните за угол для размера · двойной щелчок — текст · стрелки — точное движение</div>
   <div id="editorValidation" role="status"></div>
 </main>
 <aside class="panel right">
   <div class="panelhead" id="propsTitle">Свойства</div>
   <div class="dochead"><label for="docname">Название макета</label><input id="docname" type="text" autocomplete="off"></div>
   <div id="props"></div>
   <details id="samplePanel" class="sample-panel"><summary>Предпросмотр с данными каталога</summary>
     <input id="sampleSearch" type="search" placeholder="Найти позицию…" aria-label="Поиск образца из каталога">
     <div id="sampleOptions" class="sample-options"></div>
     <div id="samplePreviewWrap" hidden>
       <div id="sampleName" class="smallmuted"></div>
       <img id="samplePreview" alt="Этикетка с подставленными данными">
       <p id="samplePreviewError" class="warn"></p>
     </div>
   </details>
 </aside>
</div>
<script src="barcodes.js"></script>
<script src="text-engine.js"></script>
<script src="raster.js"></script>
<script src="dish-engine.js"></script>
<script>
(function(){
"use strict";
let doc=null, selected=null, zoom=8, zoomMode="fit", history=[], future=[], snap=true;
let sampleItems=[],sampleID=null,sampleSearch="";
let printerMedia={widthMM:58,heightMM:38,gapMM:2,marginLeftMM:0,marginRightMM:0};
// Physical print-head origin estimated from G01 on 58×38 mm stock.
// Preview only: never modifies ESC Mnn, F0, CR or paper advance commands.
const nativePreviewOrigin={leftMM:2,topMM:1};

const typeNames={text:"Текст",barcode:"Штрихкод",line:"Линия CP866",rectangle:"Рамка",textFrame:"Рамка CP866 с текстом",framedText:"Рамка с текстом",textTable:"Таблица CP866"};

function barcodeSVG(item,width,height){
 try{
  const result=window.EZ2Barcodes.layout(item.barcodeType||"CODE39",item.value,width*8);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+(width*8)+" 100");
  svg.setAttribute("preserveAspectRatio","none");
  for(let i=0;i<result.bits.length;i++){
    if(result.bits[i]!=="1")continue;
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",result.offset+i*result.moduleDots);
    rect.setAttribute("y",0);
    rect.setAttribute("width",result.moduleDots);
    rect.setAttribute("height",100);
    rect.setAttribute("fill","#000");
    svg.appendChild(rect);
  }
  svg.style.width="100%";
  svg.style.height=item.showsHumanReadable?"calc(100% - 15px)":"100%";
  return {svg,label:result.display};
 }catch(error){
  return {svg:null,label:"",error:error.message};
 }
}

function renderTextFlow(canvas,scale,widthMM){
 const ns="http://www.w3.org/2000/svg";
 try{
   // Text placement is taken from the actual buffered ESC encoder plan.
   // Glyph outlines are approximate, but character cell widths, heights,
   // wrapping and horizontal margins reflect the selected resident font.
   const layout=window.EZ2Text.plan({...doc,
     marginLeftMM:printerMedia.marginLeftMM,
     marginRightMM:printerMedia.marginRightMM},{allowPlaceholders:true});
   let at=0;
   for(const row of layout.rows){
     const barcode=row.kind==="barcode";
     const metrics=barcode?{widthDots:8,heightDots:120}:row.font;
     const chars=barcode?45:Array.from(row.text||"").length;
     const dots=barcode?(55-layout.margins.left-layout.margins.right)*8:
       Math.max(1,chars*metrics.widthDots);
     const x=barcode?layout.margins.left:(row.margin-1);
     const node=document.createElement("div");
     node.className="text-preview-row"+(selected===row.element.id?" sel":"");
     node.style.left=((x+nativePreviewOrigin.leftMM)*scale)+"px";
     node.style.top=((at/8+nativePreviewOrigin.topMM)*scale)+"px";
     node.style.width=(Math.max(1,dots)/8*scale)+"px";
     node.style.height=(metrics.heightDots/8*scale)+"px";
     if(row.reverse)node.classList.add("is-reverse");
     node.title=barcode?"Встроенный штрихкод":
       ("ESC "+metrics.code+" · "+metrics.widthDots+"×"+metrics.heightDots+" точек");
     node.dataset.id=row.element.id;
     if(barcode){
       const preview=barcodeSVG(row.element,dots/8,metrics.heightDots/8);
       if(preview.svg)node.appendChild(preview.svg);
       else node.textContent=preview.error;
     }else if(chars){
       const svg=document.createElementNS(ns,"svg");
       svg.setAttribute("viewBox","0 0 "+dots+" "+metrics.heightDots);
       svg.setAttribute("preserveAspectRatio","none");
       const cells=Array.from(row.text||"");
       const cw=metrics.widthDots,ch=metrics.heightDots;
       for(let i=0;i<cells.length;i++){
         const glyph=cells[i],cx=i*cw,my=ch/2,mx=cx+cw/2;
         let segments=[];
         const single={
           "─":[[cx,my,cx+cw,my]],"│":[[mx,0,mx,ch]],
           "┌":[[mx,my,cx+cw,my],[mx,my,mx,ch]],
           "┐":[[cx,my,mx,my],[mx,my,mx,ch]],
           "└":[[mx,0,mx,my],[mx,my,cx+cw,my]],
           "┘":[[mx,0,mx,my],[cx,my,mx,my]],
           "├":[[mx,0,mx,ch],[mx,my,cx+cw,my]],
           "┤":[[mx,0,mx,ch],[cx,my,mx,my]],
           "┬":[[cx,my,cx+cw,my],[mx,my,mx,ch]],
           "┴":[[cx,my,cx+cw,my],[mx,0,mx,my]],
           "┼":[[cx,my,cx+cw,my],[mx,0,mx,ch]]
         };
         if(single[glyph])segments=single[glyph];
         else if("═║╔╗╚╝".includes(glyph)){
           const delta=Math.max(1,Math.min(2.3,cw/8));
           const horiz=yy=>[cx,yy,cx+cw,yy],vert=xx=>[xx,0,xx,ch];
           if(glyph==="═")segments=[horiz(my-delta),horiz(my+delta)];
           if(glyph==="║")segments=[vert(mx-delta),vert(mx+delta)];
           if(glyph==="╔"||glyph==="╗"||glyph==="╚"||glyph==="╝"){
             const left=glyph==="╗"||glyph==="╝",upper=glyph==="╔"||glyph==="╗";
             const verticalX=mx+(left?0:0);
             segments=[
               [verticalX-delta,upper?my-delta:0,verticalX-delta,upper?ch:my+delta],
               [verticalX+delta,upper?my-delta:0,verticalX+delta,upper?ch:my+delta],
               [left?cx:mx,my-delta,left?mx:cx+cw,my-delta],
               [left?cx:mx,my+delta,left?mx:cx+cw,my+delta]
             ];
           }
         }
         if(segments.length){
           for(const [x1,y1,x2,y2] of segments){
             const line=document.createElementNS(ns,"line");
             line.setAttribute("x1",String(x1));line.setAttribute("y1",String(y1));
             line.setAttribute("x2",String(x2));line.setAttribute("y2",String(y2));
             line.setAttribute("stroke",row.reverse?"#fff":"#111");line.setAttribute("stroke-width",metrics.bold?"1.2":"0.85");
             svg.appendChild(line);
           }
         }else if(glyph==="█"){
         const rect=document.createElementNS(ns,"rect");
         rect.setAttribute("x",String(cx));rect.setAttribute("y","0");
         rect.setAttribute("width",String(cw));rect.setAttribute("height",String(ch));
         rect.setAttribute("fill",row.reverse?"#fff":"#111");svg.appendChild(rect);
       }else if(glyph!==" "){
           const g=document.createElementNS(ns,"text");
           g.setAttribute("x",String(mx));g.setAttribute("y",String(ch*.83));
           g.setAttribute("text-anchor","middle");g.setAttribute("font-family","Menlo, monospace");
           g.setAttribute("font-size",String(ch*.90));
           g.setAttribute("textLength",String(cw*.92));
           g.setAttribute("lengthAdjust","spacingAndGlyphs");
           g.setAttribute("font-weight",metrics.bold?"800":"500");
           g.setAttribute("fill",row.reverse?"#fff":"#111");g.textContent=glyph;svg.appendChild(g);
         }
       }
node.appendChild(svg);
     }
     node.addEventListener("click",event=>{event.stopPropagation();setSelected(row.element.id);});
     canvas.appendChild(node);
     at+=metrics.heightDots;
   }
   for(const g of [{width:layout.margins.left,x:0},
     {width:layout.margins.right,x:55-layout.margins.right}]){
     if(!g.width)continue;
     const guide=document.createElement("div");guide.className="marginguide";
     guide.style.left=(g.x*scale)+"px";
     guide.style.width=(g.width*scale)+"px";
     canvas.appendChild(guide);
   }
 }catch(error){
   const warning=document.createElement("div");
   warning.className="text-preview-error";
   warning.textContent=(doc.elements.length?"Проверка печати: "+error.message:
      "Макет пустой. Добавьте «＋ Строка» сверху, чтобы начать этикетку.")+
     "\nВыберите строку в левом списке, чтобы исправить макет.";
   canvas.appendChild(warning);
 }
 // The 55-mm raster command limit is not a user-configured margin.
 // Text mode shows the whole physical label; no misleading striped inset.
}

function renderCanvas(){
 const el=$("label");el.querySelectorAll(".obj,.printzone,.mediazone,.marginguide,.text-preview-row,.text-preview-error").forEach(n=>n.remove());if(!doc)return;

     usableWidth/Math.max(10,doc.widthMM),
     usableHeight/Math.max(10,doc.heightMM)

 if(doc.printMode==="text"&&window.EZ2Text){
   renderTextFlow(el,zoom,width);
   return;
 }
 const flowPositions=new Map();
 const textMode=doc.printMode==="text";
 if(textMode && window.EZ2Text){
   try{
     const layout=window.EZ2Text.plan({...doc,
        marginLeftMM:printerMedia.marginLeftMM,
        marginRightMM:printerMedia.marginRightMM},{allowPlaceholders:true});
     let at=0;
     for(const row of layout.rows){
       const key=row.element.id;
       if(!flowPositions.has(key))flowPositions.set(key,{top:at,height:0});
       const height=row.kind==="barcode"?120:row.font.heightDots;
       flowPositions.get(key).height+=height;at+=height;
     }
   }catch(error){
     // Keep the editable source visible even while it contains invalid data.
   }
 }
 const insetLeft=textMode?Number(printerMedia.marginLeftMM||0):0;
 const insetRight=textMode?Number(printerMedia.marginRightMM||0):0;
 doc.elements.forEach(function(e){
   let node=document.createElement("div");node.className="obj"+(selected===e.id?" sel":"");node.dataset.id=e.id;
   const flow=flowPositions.get(e.id);
   node.style.left=((textMode?insetLeft:e.xMM)*zoom)+"px";
   node.style.top=(flow?flow.top/8*zoom:e.yMM*zoom)+"px";
   node.style.width=Math.max(3,(textMode?Math.max(1,Math.min(55,doc.widthMM)-insetLeft-insetRight):e.widthMM)*zoom)+"px";
   node.style.height=Math.max(3,(flow?flow.height/8:e.heightMM)*zoom)+"px";
   let visual=document.createElement("div");visual.className="visual "+e.kind;
   if(e.kind==="text"){
     visual.textContent=String(e.prefix||"")+String(e.value||"");
     let nativeHeight=null;

       try{nativeHeight=window.EZ2Text.font(e.deviceFont||"A00").heightDots;}catch(_e){}
     }
     visual.style.fontSize=nativeHeight?
       Math.max(7,(nativeHeight/8*zoom*0.8))+"px":
       (e.fontSize*zoom/2.8346457)+"px";
     visual.style.fontWeight=e.isBold?"700":"400";
     visual.style.textAlign=e.textAlignment||"left";
     visual.style.transform="rotate("+(e.rotation||0)+"deg)";
   }else if(e.kind==="framedText"){
     const border=Math.max(1,Number(e.frameBorderMM||.25)*zoom);
     const pad=Math.max(0,Number(e.framePaddingMM??1.5)*zoom);
     visual.style.border=border+"px solid #111";
     visual.style.padding=pad+"px";
     visual.style.whiteSpace="pre-wrap";
     visual.style.overflow="hidden";
     visual.style.fontSize=Math.max(7,Number(e.fontSize||12)*zoom/2.8346457)+"px";
     visual.style.fontWeight=e.isBold?"700":"400";
     visual.style.textAlign=e.textAlignment||"left";
     visual.style.lineHeight="1.08";
     visual.textContent=e.value||"";
   } else if(e.kind==="barcode"){
     const preview=barcodeSVG(e,e.widthMM,e.heightMM);
     if(preview.svg)visual.appendChild(preview.svg);
     else {visual.textContent=preview.error;visual.classList.add("invalid");}
     if(e.showsHumanReadable&&preview.svg){
       let digits=document.createElement("div");digits.className="digits";
       digits.textContent=preview.label;
       digits.style.fontSize=Math.max(9,zoom*1.65)+"px";
       visual.appendChild(digits);
     }
   }
   node.appendChild(visual);
   if(selected===e.id && !textMode){
     for(const corner of ["nw","ne","sw","se"]){
       const handle=document.createElement("div");

     }
   }
   node.title=textMode?"Текстовый режим: порядок строк меняется стрелками в панели слоёв":
     selected===e.id?"Перетащите объект · углы изменяют размер":"Щёлкните или перетащите для выбора слоя";
   node.addEventListener("click",ev=>{ev.stopPropagation();});
   node.addEventListener("dblclick",ev=>{
     ev.stopPropagation();

     if(textMode){ev.stopPropagation();setSelected(e.id);}

 });
 // User-defined text margins are separate from the fixed ESC G55 limit.
 if(textMode){

   beyond.style.height=((height-printerMedia.heightMM)*zoom)+"px";
   beyond.title="Шаблон выше рулона, указанного в настройках";
   el.appendChild(beyond);
 }
}
// Geometry is kept pure so native CI can test corner resizing without a WebView.
function transformRect(original,dx,dy,mode,docWidth,docHeight,step,minimum){
 const round=n=>Math.round(n/step)*step;
 const clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
 if(mode==="move"){
   return {
     xMM:clamp(round(original.xMM+dx),0,Math.max(0,docWidth-original.widthMM)),
     yMM:clamp(round(original.yMM+dy),0,Math.max(0,docHeight-original.heightMM)),
     widthMM:original.widthMM,
     heightMM:original.heightMM
   };
 }
 let left=original.xMM,top=original.yMM;
 let right=original.xMM+original.widthMM,bottom=original.yMM+original.heightMM;
 if(mode.includes("w"))left=clamp(round(original.xMM+dx),0,right-minimum);
 if(mode.includes("e"))right=clamp(round(original.xMM+original.widthMM+dx),left+minimum,docWidth);
 if(mode.includes("n"))top=clamp(round(original.yMM+dy),0,bottom-minimum);
 if(mode.includes("s"))bottom=clamp(round(original.yMM+original.heightMM+dy),top+minimum,docHeight);
 return {xMM:left,yMM:top,widthMM:Math.max(minimum,right-left),heightMM:Math.max(minimum,bottom-top)};
}

function startManipulation(ev,id,mode){
 // A canvas click is an explicit selection, not an automatic layer guess.
 if(ev.button!==0||!doc)return;
 const item=doc.elements.find(x=>x.id===id);if(!item)return;
 ev.preventDefault();ev.stopPropagation();
 if(selected!==id){
   selected=id;
   renderLayers();renderProps();renderCanvas();
 }
 const original=clone(item),sx=ev.clientX,sy=ev.clientY,step=snap?1:0.125;
 const minimum=item.kind==="line"?0.125:1;
 checkpoint();
 function move(event){
   const active=doc.elements.find(x=>x.id===selected);if(!active||active.id!==id)return;
   const dims=transformRect(original,(event.clientX-sx)/zoom,(event.clientY-sy)/zoom,
                            mode,doc.widthMM,doc.heightMM,step,minimum);
   Object.assign(active,dims);
   renderCanvas();
 }
 function finish(){
   window.removeEventListener("pointermove",move);
   window.removeEventListener("pointerup",finish);
   window.removeEventListener("pointercancel",finish);
   window.removeEventListener("blur",finish);
   renderCanvas();renderProps();renderLayers();commit();
 }
 window.addEventListener("pointermove",move);
 window.addEventListener("pointerup",finish);
 window.addEventListener("pointercancel",finish);
 window.addEventListener("blur",finish);
}

function textInput(value,onChange,multiline,id){
 let el=document.createElement(multiline?"textarea":"input");if(!multiline)el.type="text";if(id)el.id=id;el.value=value??"";
 el.addEventListener("focus",()=>checkpoint());

 return el;
}
function numInput(value,onChange,min,max,step){
 const input=document.createElement("input");input.type="number";
 input.step=String(step??0.1);if(min!==undefined)input.min=String(min);
 if(max!==undefined)input.max=String(max);input.value=String(value);
 const wrapper=document.createElement("div");wrapper.className="editor-stepper";
 const minus=document.createElement("button"),plus=document.createElement("button");
 for(const [b,label] of [[minus,"−"],[plus,"＋"]]){b.type="button";b.textContent=label;}
 function apply(){
   const n=Number(input.value);if(!Number.isFinite(n))return;
   const clamped=Math.max(min??-1e6,Math.min(max??1e6,n));
   input.value=String(clamped);checkpoint();onChange(clamped);
   renderCanvas();renderLayers();commit();
 }
 input.addEventListener("change",apply);
 function adjust(dir){
   const unit=Number(step)||1,places=String(unit).split(".")[1]?.length||0;
   const current=Number(input.value)||0;
   input.value=String(Math.max(min??-1e6,Math.min(max??1e6,
     Number((current+dir*unit).toFixed(Math.min(6,places))))));
   apply();
 }
 minus.onclick=()=>adjust(-1);plus.onclick=()=>adjust(1);
 wrapper.append(minus,input,plus);
 return wrapper;
}

  const svg=document.createElementNS(ns,"svg"),w=f.widthDots*3,h=f.heightDots;
  svg.setAttribute("viewBox","0 0 "+w+" "+h);svg.setAttribute("preserveAspectRatio","none");
  svg.style.width=Math.max(12,w*.7)+"px";svg.style.height=Math.max(7,h*.7)+"px";
  const t=document.createElementNS(ns,"text");

  t.setAttribute("font-weight",f.bold?"800":"500");

  box.appendChild(button);

      root.appendChild(prop("Поворот",choiceButtons(
        [0,90,180,270].map(x=>[String(x),x+"°"]),String(e.rotation||0),
        v=>{checkpoint();e.rotation=Number(v);renderCanvas();renderProps();commit();})));
 } else if(e.kind==="barcode"){
   root.appendChild(prop("Тип штрихкода",choiceButtons([
      ["CODE128","Code 128"],["CODE39","Code 39"],["EAN13","EAN-13"],["EAN8","EAN-8"]],
      e.barcodeType||"CODE128",v=>{checkpoint();e.barcodeType=v;draw();commit();})));
   root.appendChild(checkbox("Печатать цифры под штрихкодом",e.showsHumanReadable,n=>{e.showsHumanReadable=n;}));
   root.appendChild(checkbox("Менять данные при заполнении",e.isVariable!==false,n=>{e.isVariable=n;renderLayers();}));
   if(e.isVariable!==false){
     root.appendChild(prop("Имя поля в карточке каталога",
       textInput(e.fieldName||"",v=>{e.fieldName=v;},false,"field-name")));
     root.appendChild(prop("Выбрать поле каталога",variableChooser(e)));
   }
   const status=document.createElement("p");status.className="hint";
   try{
     const coded=window.EZ2Barcodes.layout(e.barcodeType||"CODE39",e.value,e.widthMM*8);
     status.textContent="Код: "+coded.display+" · "+coded.moduleDots+" точек/модуль"+
       (coded.checksum!==undefined?" · проверка: "+coded.checksum:"");
   }catch(error){status.className="warn";status.textContent=error.message;}
   root.appendChild(status);
   const info=document.createElement("p");info.className="hint";
   info.textContent="Штрихкод генерируется как сканируемые модули, не шрифт. В редакторе и в печати используется один кодировщик. EAN: контрольная цифра рассчитывается или проверяется.";
   root.appendChild(info);
 }
 let positionActions=document.createElement("div");positionActions.className="actions";
 for(const [axis,title] of [["x","Блок по центру X"],["y","Блок по центру Y"]]){
   const button=document.createElement("button");button.type="button";button.textContent=title;
   button.onclick=()=>{
     checkpoint();
     if(axis==="x")e.xMM=Math.max(0,(doc.widthMM-e.widthMM)/2);
     else e.yMM=Math.max(0,(doc.heightMM-e.heightMM)/2);
     renderCanvas();renderProps();commit();
   };
   positionActions.appendChild(button);
 }
 if(doc.printMode!=="text")root.appendChild(prop("Расположение блока",positionActions));
 if(e.kind==="text"||e.kind==="barcode"||e.kind==="line"){
   const full=document.createElement("button");full.type="button";
   full.textContent="На всю ширину печати";
   full.onclick=()=>{
     checkpoint();e.xMM=0;e.widthMM=Math.min(55,doc.widthMM);
     renderCanvas();renderProps();commit();
   };
   if(doc.printMode!=="text")root.appendChild(prop("Ширина блока",full));
 }
 let sep=document.createElement("div");sep.className="dividerline";root.appendChild(sep);
 let actions=document.createElement("div");actions.className="actions";
 let c=document.createElement("button");c.textContent="Дублировать";c.onclick=duplicate;
 let d=document.createElement("button");d.textContent="Удалить";d.onclick=remove;
 actions.append(c,d);root.appendChild(actions);
}
function renderValidation(){
 const el=$("editorValidation");if(!doc)return;
 try{
   if(doc.printMode==="text"){
     if(!doc.elements.length){el.textContent="Добавьте первую строку.";return;}
     const p=window.EZ2Text.plan({...doc,
       marginLeftMM:printerMedia.marginLeftMM,marginRightMM:printerMedia.marginRightMM},
       {allowPlaceholders:true});
     el.textContent="CP866: "+p.usedDots+" / 256 точек · "+p.rows.length+
       " строк · X≈"+nativePreviewOrigin.leftMM+" мм, Y≈"+
       nativePreviewOrigin.topMM+" мм (по G01)";el.classList.remove("error");
   }else{
     window.EZ2Raster.draw(doc); // Uses the same text-overflow checks as printing.
     const beyond=doc.elements.find(e=>e.xMM+e.widthMM>55||
       e.yMM+e.heightMM>35);
     if(beyond)throw Error("Объект за пределами 55×35 мм печати.");
     el.textContent="Растр: объекты внутри 55×35 мм";el.classList.remove("error");
   }
 }catch(e){el.textContent=e.message;el.classList.add("error");}
}
function draw(){
 if(!doc)return;
 $("docname").value=doc.name;
 document.body.dataset.editorMode=doc.printMode||"raster";
 $("editorModeIndicator").textContent=doc.printMode==="text"?"Текст CP866":"Растр XY";
 $("propsTitle").textContent=selectedObj()?(doc.printMode==="text"?"Настройки строки":"Свойства объекта"):"Настройки макета";
 $("foot").textContent=doc.printMode==="text"?
   "Текст CP866: размеры строк и символов калиброваны по G01/G02. Положение от края приблизительное, форма букв прошивки условная. Стрелки меняют порядок.":
   "Растр: перемещайте и масштабируйте объекты, точные координаты X/Y будут сохранены.";
 renderLayers();renderCanvas();renderProps();renderValidation();
 if($("samplePanel").open)renderSample();
 $("undo").disabled=!history.length;$("redo").disabled=!future.length;
}
window.labelDeskSetMedia=function(media){
 if(!media)return;
 const w=Number(media.widthMM),h=Number(media.heightMM),g=Number(media.gapMM);
 if(!Number.isFinite(w)||!Number.isFinite(h)||!Number.isFinite(g))return;
 printerMedia={widthMM:w,heightMM:h,gapMM:g,
    marginLeftMM:Number(media.marginLeftMM||0),
    marginRightMM:Number(media.marginRightMM||0)};
 if(doc)renderCanvas();
};
window.labelDeskLoad=function(next,items){
 if(!next||!Array.isArray(next.elements))return;
 if(Array.isArray(items))sampleItems=items;
 const previousSelected=selected?.toLowerCase();
 doc=clone(next);const same=doc.elements.find(e=>e.id.toLowerCase()===previousSelected);
 selected=same?same.id:null;history=[];future=[];draw();
};
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>newElem(b.dataset.add)));
$("docname").addEventListener("focus",()=>{if(doc)checkpoint();});
 const layout=document.querySelector(".layout");
 let layersOpen=true,preferredWidth=210;
 try{
  const savedWidth=Number(localStorage.getItem("labeldesk-layer-width"));
  if(savedWidth>=165&&savedWidth<=320)preferredWidth=savedWidth;
  layersOpen=localStorage.getItem("labeldesk-layers-open")!=="false";
 }catch(_){}
 function applyLayerUI(){
  layout.style.setProperty("--layer-width",preferredWidth+"px");
  layout.classList.toggle("layers-hidden",!layersOpen);
  $("layersWidth").value=String(preferredWidth);
  $("layersWidth").hidden=!layersOpen;
  $("toggleLayers").classList.toggle("active",layersOpen);
  if(doc&&zoomMode==="fit")renderCanvas();
 }
 $("toggleLayers").onclick=()=>{
  layersOpen=!layersOpen;
  try{localStorage.setItem("labeldesk-layers-open",String(layersOpen));}catch(_){}
  applyLayerUI();
 };
 $("layersWidth").addEventListener("input",ev=>{
  preferredWidth=Number(ev.target.value);
  try{localStorage.setItem("labeldesk-layer-width",String(preferredWidth));}catch(_){}
  applyLayerUI();
 });
 $("layerPicker").addEventListener("change",ev=>setSelected(ev.target.value));
 applyLayerUI();
$("docname").addEventListener("input",function(){if(!doc)return;doc.name=this.value;commit();});
$("label").addEventListener("click",ev=>{ev.stopPropagation();setSelected(null);});
$("docSettings").addEventListener("click",()=>setSelected(null));
$("zoomFit").addEventListener("click",()=>{zoomMode="fit";renderCanvas();});
$("zoomMinus").addEventListener("click",()=>{zoomMode="manual";zoom=Math.max(3,zoom-1.5);renderCanvas();});
$("zoomPlus").addEventListener("click",()=>{zoomMode="manual";zoom=Math.min(24,zoom+1.5);renderCanvas();});

window.addEventListener("resize",()=>{if(zoomMode==="fit")renderCanvas();});
$("up").onclick=()=>moveLayer(1);$("down").onclick=()=>moveLayer(-1);
$("clone").onclick=duplicate;$("remove").onclick=remove;
$("undo").onclick=()=>{restore(history,future);$("undo").disabled=!history.length;$("redo").disabled=!future.length;};
$("redo").onclick=()=>{restore(future,history);$("undo").disabled=!history.length;$("redo").disabled=!future.length;};
document.addEventListener("keydown",function(ev){
 const editable=["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName);
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();send("save");return;}
 if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="z"){ev.preventDefault();if(ev.shiftKey)$("redo").click();else $("undo").click();return;}
 if(!editable&&selected&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(ev.key)){
   ev.preventDefault();
   if(doc?.printMode==="text")return;
   const e=selectedObj();if(!e)return;
   const step=ev.shiftKey?1:(snap?1:0.125);
   const dx=ev.key==="ArrowLeft"?-step:ev.key==="ArrowRight"?step:0;
   const dy=ev.key==="ArrowUp"?-step:ev.key==="ArrowDown"?step:0;
   checkpoint();
   Object.assign(e,transformRect(clone(e),dx,dy,"move",doc.widthMM,doc.heightMM,snap?1:0.125,1));
   renderCanvas();renderProps();commit();
   return;
 }
 if(!editable&&(ev.key==="Delete"||ev.key==="Backspace")){ev.preventDefault();remove();}
});
// Embedded editor receives JSON from the outer HTML application.
window.addEventListener("message",function(event){
 if(event.source!==window.parent || event.data?.source!=="labeldesk-app")return;
 if(event.data.type==="load" && event.data.document){
   if(event.data.media)window.labelDeskSetMedia(event.data.media);
   window.labelDeskLoad(event.data.document,event.data.items);
 }
});
$("sampleSearch").addEventListener("input",event=>{
 sampleSearch=event.target.value||"";renderSample();
});
$("sampleOptions").addEventListener("click",event=>{
 const btn=event.target.closest("[data-sample-id]");
 if(!btn)return;sampleID=btn.dataset.sampleId;renderSample();
});
$("samplePanel").addEventListener("toggle",()=>{if($("samplePanel").open)renderSample();});
send("ready");
})();
</script>
</body>
</html>
