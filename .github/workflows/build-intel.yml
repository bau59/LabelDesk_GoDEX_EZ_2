name: Build Intel macOS

on:
  push:
    branches:
      - main
      - fix/calibration-parity-0.9.2
      - fix/verified-line-printing
      - fix/line-feed-and-raster-size-094
      - fix/ez2-job-tear-feed-095
      - rewrite/web-shell-driver
      - fix/media-settings-template-compatibility-102
      - fix/sidebar-workflow-and-ui-103
      - feat/ez2-native-fonts-barcodes-editor
      - feat/native-cp866-food-presets-105
      - feat/universal-items-ui-107
      - feat/simple-folders-margins-108
      - feat/print-page-catalog-folders-icon-109
      - feat/dual-editor-font-preview-110
      - feat/clear-catalog-print-library-111
      - feat/compact-print-presets-framed-text-112
      - feat/print-calibration-backup-ui-113
      - feat/editor-one-label-test-print-114
      - feat/native-calibrated-preview-115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labeldesk-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-smoke:
    name: Validate WebKit UI and printer packets (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript and interfaces without macOS hardware
        shell: bash
        run: |
          set -euo pipefail
          node --check LabelDesk/Resources/app.js
          node --check LabelDesk/Resources/diagnostics.js
          node Tests/PrinterDiagnosticsSmoke.js
          node Tests/PrinterTransportSmoke.js
          node Tests/EditorSamplePrintSmoke.js
          node Tests/NativeCalibrationSmoke.js
          node --check LabelDesk/Resources/dish-controller.js
          node --check LabelDesk/Resources/dish-engine.js
          node --check LabelDesk/Resources/text-engine.js
          node --check LabelDesk/Resources/raster.js
          node --check LabelDesk/Resources/diagnostics.js
          python3 -c "import pathlib,re; s=pathlib.Path('LabelDesk/Resources/editor.html').read_text(); m=re.search(r'<script>(.*?)</script>',s,re.S); assert m; pathlib.Path('/tmp/label-editor.js').write_text(m.group(1))"
          node --check /tmp/label-editor.js
          node Tests/WebRasterSmoke.js
          node Tests/MediaCompatibilitySmoke.js
          node Tests/SidebarWorkflowSmoke.js
          node Tests/DishCatalogSmoke.js
          node Tests/BarcodesNativeSmoke.js
          node Tests/CP866FoodSmoke.js
          node Tests/EditorGeometrySmoke.js
          node Tests/PrinterDiagnosticsSmoke.js
          node Tests/PrinterTransportSmoke.js
          node Tests/EditorSamplePrintSmoke.js
          node Tests/NativeCalibrationSmoke.js

  build-intel:
    name: Build x86_64 .app and .dmg
    runs-on: macos-15-intel
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' LabelDesk/Resources/Info.plist)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Intel build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          swiftc --version

      - name: Compile and package LabelDesk
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          zsh -n Scripts/install-update.sh
          zsh Scripts/build-installer.sh
          test -f build/LabelDesk.app/Contents/Resources/install-update.sh
          test -f build/LabelDesk.app/Contents/Resources/editor.html
          test -f build/LabelDesk.app/Contents/Resources/app.html
          test -f build/LabelDesk.app/Contents/Resources/app.js
          test -f build/LabelDesk.app/Contents/Resources/raster.js
          test -f build/LabelDesk.app/Contents/Resources/barcodes.js
          test -f build/LabelDesk.app/Contents/Resources/native.js
          test -f build/LabelDesk.app/Contents/Resources/text-engine.js
          test -f build/LabelDesk.app/Contents/Resources/food-presets.js
          test -f build/LabelDesk.app/Contents/Resources/dish-engine.js
          test -f build/LabelDesk.app/Contents/Resources/dish-controller.js
          test -f build/LabelDesk.app/Contents/Resources/diagnostics.js
          test -s build/LabelDesk.app/Contents/Resources/LabelDesk.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' build/LabelDesk.app/Contents/Info.plist)" = LabelDesk
          test -f build/LabelDesk.app/Contents/Resources/printer-text.sh
          test -f build/LabelDesk.app/Contents/Resources/printer-native.sh
          test -f build/LabelDesk.app/Contents/Resources/printer.sh
          BIN="build/LabelDesk.app/Contents/MacOS/LabelDesk"
          test -f "$BIN"
          test "$(lipo -archs "$BIN")" = "x86_64"
          plutil -lint build/LabelDesk.app/Contents/Info.plist
          codesign --verify --deep --strict build/LabelDesk.app
          test -f "build/LabelDesk-${APP_VERSION}.dmg"
          ditto -c -k --keepParent build/LabelDesk.app "build/LabelDesk-${APP_VERSION}-intel.zip"

      - name: Validate Xcode project configuration
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint LabelDesk.xcodeproj/project.pbxproj
          xcodebuild -list -project LabelDesk.xcodeproj > /tmp/labeldesk-xcode-list.log 2>&1 || {
            tail -n 100 /tmp/labeldesk-xcode-list.log
            exit 1
          }

      - name: Verify ESC graphics packet and raster size
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -target x86_64-apple-macosx15.0 -sdk "$SDK_PATH" \
            -parse-as-library -framework AppKit \
            LabelDesk/Models/LabelDocument.swift \
            LabelDesk/Models/LabelElement.swift \
            LabelDesk/Models/PrinterProfile.swift \
            LabelDesk/Services/LabelRasterizer.swift \
            LabelDesk/Services/GodexEZ2Encoder.swift \
            Tests/RasterEncoderSmokeTest.swift \
            -o build/raster-smoke
          ./build/raster-smoke

      - name: Verify update with the real Intel ZIP
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -target x86_64-apple-macosx15.0 -sdk "$SDK_PATH" \
            -parse-as-library -framework AppKit -framework Combine -framework CryptoKit \
            LabelDesk/App/UpdateManager.swift \
            Tests/UpdaterPackageSmokeTest.swift \
            -o build/updater-package-smoke
          ./build/updater-package-smoke "build/LabelDesk-${APP_VERSION}-intel.zip" "$APP_VERSION"

      - name: Verify automatic update replacement and rollback
        shell: bash
        run: zsh Tests/UpdaterSmoke.sh

      - name: Check HTML editor JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import pathlib,re; s=pathlib.Path('LabelDesk/Resources/editor.html').read_text(); m=re.search(r'<script>(.*?)</script>',s,re.S); assert m; pathlib.Path('/tmp/label-editor.js').write_text(m.group(1))"
          node --check /tmp/label-editor.js
          node --check LabelDesk/Resources/barcodes.js
          node --check LabelDesk/Resources/native.js
          node --check LabelDesk/Resources/text-engine.js
          node --check LabelDesk/Resources/food-presets.js
          node --check LabelDesk/Resources/dish-engine.js
          node --check LabelDesk/Resources/dish-controller.js
          node --check LabelDesk/Resources/raster.js
          node --check LabelDesk/Resources/app.js
          node Tests/WebRasterSmoke.js
          node Tests/MediaCompatibilitySmoke.js
          node Tests/SidebarWorkflowSmoke.js
          node Tests/DishCatalogSmoke.js
          node Tests/BarcodesNativeSmoke.js
          node Tests/CP866FoodSmoke.js
          zsh -n Scripts/printer.sh
          zsh -n Scripts/printer-native.sh
          zsh -n Scripts/printer-text.sh

      - name: Test selected-layer resize geometry
        shell: bash
        run: node Tests/EditorGeometrySmoke.js

      - name: Test folder persistence and quick-fill immutability
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -target x86_64-apple-macosx15.0 -sdk "$SDK_PATH"             -parse-as-library             LabelDesk/Models/LabelDocument.swift             LabelDesk/Models/LabelElement.swift             LabelDesk/Models/PrinterProfile.swift             LabelDesk/Models/PrintJob.swift             LabelDesk/Services/StorageService.swift             Tests/QuickPrintSmokeTest.swift             -o build/quickprint-smoke
          ./build/quickprint-smoke

      - name: Verify persistent print diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -target x86_64-apple-macosx15.0 -sdk "$SDK_PATH" \
            -parse-as-library -framework Combine \
            LabelDesk/Services/PrintDiagnostics.swift \
            Tests/PrintDiagnosticsSmokeTest.swift \
            -o build/print-diagnostics-smoke
          ./build/print-diagnostics-smoke

      - name: Upload Intel packages
        uses: actions/upload-artifact@v4
        with:
          name: LabelDesk-${{ steps.version.outputs.value }}-macOS-Intel
          path: |
            build/LabelDesk-${{ steps.version.outputs.value }}.dmg
            build/LabelDesk-${{ steps.version.outputs.value }}-intel.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish versioned GitHub Release
    needs: [build-intel, web-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LabelDesk-${{ needs.build-intel.outputs.version }}-macOS-Intel
          path: dist

      - name: Publish new version only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build-intel.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG already published; skip release."
            exit 0
          fi
          gh release create "$TAG" \
            "dist/LabelDesk-${APP_VERSION}.dmg" \
            "dist/LabelDesk-${APP_VERSION}-intel.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LabelDesk ${APP_VERSION}" \
            --notes "LabelDesk 1.0.15 for Intel macOS 15+. Native CP866 editor calibrated from real G01 and G02 label prints on 58x38 mm media: approximately 2 mm left and 1 mm top print-head origin are reflected in PREVIEW ONLY, not firmware positioning or feed commands. Resident A00-A48 display glyphs use confirmed cell widths and heights rather than small browser font glyphs. ESC V reversed rows display a black background with white text and insert a single A00 blank row between inverse and the next native line to prevent observed contact/overprint. Added editable native text TABLE with 2-4 configurable column widths, CP866 junctions and wrapped cells, a one-click native black headline, and native single/double/solid line with adjustable length. Legacy templates, raster printer engine and serial transport are unchanged. Physical validation of any additional print spacing and precise firmware glyph shapes remains necessary. Ad-hoc signed, not notarized."
